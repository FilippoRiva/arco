# yaml-language-server: $schema=./../schema.json
# Benchmark configuration for the GPT-4.1 nano research baseline.
global:
  workflow: "websearch_researcher"
  enable_budget_controller: false
  default_provider: openai
  default_model: gpt-4.1-nano
  default_provider_judge: openai
  default_model_judge: gpt-5.6-luna
  enable_storage: false
  enable_codecarbon: true

defaults: {}

runs:
  - name: Baseline
    description: Standard GPT-4.1 nano research-agent configuration
    changes: {}
