# yaml-language-server: $schema=./../schema.json
# =============================================================================
# TEST AGENTS SECTION
# =============================================================================
# Test for the agents section

global:
  workflow: "planned_sales"
  prompt: "Show me the sales in Nov 2021, with date as x and sales value as y"
  default_provider: openai
  default_model: gpt-4.1-nano

agents:
  Retriever:
    provider: openrouter
    model: deepseek/deepseek-v4-flash-0731
    n: 2
    bon_param: "temperature"
    temp_min: 0.1
    temp_max: 1.0
    cot_n: 2

  Analyzer:
    provider: openai
    model: gpt-4.1
    n: 3
    bon_param: "temperature"
    temp_min: 0.6
    temp_max: 1.1

  Visualizer:
    n: 4
    bon_param: "temperature"
    temp_min: 0.8
    temp_max: 1.4
  Planner: 
    n: 1
    temp_min: 0.2
