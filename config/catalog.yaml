# Named experiment definitions used by benchmark generation, execution, and analysis.
# Paths are relative to the repository root.
experiments:
  demo-planned-gpt41-nano:
    description: Small planned sales benchmark used for demonstrations.
    workflow: planned_sales
    generation:
      config: config/sales/run/bench_gen_planned.yaml
      prompts: config/sales/bench/prompts/prompts_demo.json
      output: config/sales/bench/data/benchmark_demo.json
    benchmark:
      config: config/sales/bench/demo.yaml
      output_dir: output/benchmarks/demo-planned-gpt41-nano
    tags: [demo, sales, planned]

  research-websearch-model-comparison:
    description: Web research workflow model comparison benchmark.
    workflow: websearch_researcher
    generation:
      config: config/research/run/bench_gen_websearch.yaml
      prompts: config/research/bench/prompts/prompts.json
      output: config/research/bench/data/benchmark_websearch.json
    benchmark:
      config: config/research/bench/model_comparison_websearch.yaml
      output_dir: output/benchmarks/research-websearch-model-comparison
    tags: [research, websearch, model-comparison]
